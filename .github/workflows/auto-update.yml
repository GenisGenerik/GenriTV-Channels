name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: iptv-auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run Pipeline
        run: python scripts/pipeline.py

      - name: Verify generated channel data
        shell: bash
        run: |
          set -e
          test -s generated/channels.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("generated/channels.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, list) or not data:
              raise SystemExit("generated/channels.json contains no channels")

          print(f"Generated channel count: {len(data)}")
          print("First channels:")
          for channel in data[:10]:
              print(f"- {channel.get('nama', '')}: {channel.get('urls', [])[:1]}")
          PY

      - name: Commit and Push changes
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'

          git add generated/

          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi

          git commit -m 'Auto-update IPTV playlist'

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
