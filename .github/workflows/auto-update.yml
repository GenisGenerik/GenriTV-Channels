name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write # Diperlukan agar bot bisa melakukan commit/push

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pastikan seluruh histori diambil agar rebase/push bekerja
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run Pipeline
        run: python scripts/pipeline.py
        env:
          PLAYLIST_SOURCE: ${{ secrets.PLAYLIST_SOURCE }}
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Konfigurasi remote untuk memastikan push dilakukan ke branch yang benar
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git add generated/
          
          # Cek apakah ada perubahan
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update IPTV playlist"
            
            # Tarik perubahan terbaru dari remote untuk menghindari konflik
            git pull --rebase origin main
            
            # Push perubahan
            git push origin main
          fi
