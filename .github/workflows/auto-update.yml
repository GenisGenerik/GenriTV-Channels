name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: iptv-auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run Pipeline
        run: python scripts/pipeline.py
        env:
          PLAYLIST_SOURCE: ${{ secrets.PLAYLIST_SOURCE }}

      - name: Commit and Push changes
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'

          git add generated/

          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi

          git commit -m 'Auto-update IPTV playlist'

          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."
            git fetch origin main
            git rebase origin/main || {
              echo 'Rebase failed. Aborting rebase.'
              git rebase --abort || true
              exit 1
            }

            if git push origin HEAD:main; then
              echo 'Push succeeded.'
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo 'Push was rejected; retrying with latest remote state...'
              git fetch origin main
              git rebase origin/main
            fi
          done

          echo 'Push failed after 3 attempts.'
          exit 1